name: Bug report
description: Report a reproducible problem using synthetic or anonymized data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real network, customer, or vendor-confidential data.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the layout, mapping, unit, threshold, browser, and operating system.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal synthetic sample
      description: Paste a small synthetic sample or link to a public reproduction.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I confirm that this report contains no real network, customer, secret, private URL, or vendor-confidential data.
          required: true
